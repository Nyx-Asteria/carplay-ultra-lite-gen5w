name: Signed release bundle
on:
  push:
    branches: [rc11-final]
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish after successful signed bundle verification (manual runs default to verification only)"
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  package:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/rc11-final' && github.event.head_commit.message == 'Release 1.0.0-rc.11')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: Open-HMG/HMG-API
          ref: daa083717f07565ba16dc8a4d26291b7d68d3bf4
          path: .hmgapi
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: Nyx-Asteria/hmgapi-comfort
          ref: 2724ac576da1f05991efdd34a8182fb7651c86bb
          path: .comfort
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: Nyx-Asteria/HMG-IconDump
          ref: 55e8de065f32776ab9eb466207364e0bb66bf29b
          path: .collector
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: Nyx-Asteria/hmgapi-wireless-cp-aa
          ref: 3c3d2489b5bd4b8f4b8d37a5a451341701f78bce
          path: .wireless
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: Nyx-Asteria/Phone-Projection-Scaling
          ref: bd57be364d95d9542b5aaf81269fa2b8dc1d35e2
          path: .pps
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: Nyx-Asteria/Standalone_TBT
          ref: fac2ec367028a97334d548c53d5930d768ec2694
          path: .tbt
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Cache checksum-pinned video dependencies
        uses: actions/cache@v4
        with:
          path: |
            source/mod/tools/video/libs
            source/mod/tools/video/r8.jar
          key: cpul-video-${{ runner.os }}-${{ hashFiles('source/mod/tools/video/fetch-libs.sh') }}
      - name: SDK
        run: |
          sudo apt-get update -q
          sudo apt-get install -yq clang lld zip unzip mksh python3-pyelftools
          (cd .hmgapi && ./build.sh sdk)
          mkdir -p out/sdk
          unzip -q .hmgapi/out/dist/hmgapi-mod-sdk-*.zip -d out/sdk
      - name: Read release version
        run: |
          VERSION=$(python3 -c 'import json; print(json.load(open("source/mod/mod.json"))["version"])')
          echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+-rc\.[0-9]+$'
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            test "$VERSION" = "1.0.0-rc.11"
            test "$(git log -1 --format=%s)" = "Release 1.0.0-rc.11"
          fi
          test -f "docs/rc${VERSION##*.}-testing.md"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
      - name: Build and sign seven packages
        shell: bash
        env:
          MOD_KEY: ${{ secrets.MOD_KEY }}
          MOD_KEY_PUB: ${{ secrets.MOD_KEY_PUB }}
          AUTHOR_UUID: d515981b-afc8-8230-ae0f-62d32de366bc
        run: |
          set -euo pipefail
          export HMGAPI_SDK="$PWD/out/sdk"
          export OUT="$PWD/out"
          SDK="$HMGAPI_SDK"
          AJ=$(find "$ANDROID_HOME/platforms" -name android.jar | sort -V | tail -1)
          D8=$(find "$ANDROID_HOME/build-tools" -name d8 -type f | sort -V | tail -1)
          umask 077
          KEY="$RUNNER_TEMP/release-author.key"
          trap 'rm -f "$KEY" "$KEY.pub"' EXIT
          test -n "$MOD_KEY" && test -n "$MOD_KEY_PUB"
          printf '%s' "$MOD_KEY" | base64 -d > "$KEY"
          printf '%s' "$MOD_KEY_PUB" | base64 -d > "$KEY.pub"
          test "$(java -cp "$SDK/lib/hmgapi-engine.jar" hmgapi.engine.Signing uuid "$KEY.pub")" = "$AUTHOR_UUID"
          unset MOD_KEY MOD_KEY_PUB
          mkdir -p out/staging out/park-tests out/tests out/check-classes out/check-dex
          javac --release 8 -d out/park-tests source/mod/src/ioniq6/cpclimate/ParkedState.java source/tests/ParkedStateTest.java
          java -cp out/park-tests ioniq6.cpclimate.ParkedStateTest
          python3 source/tests/release_workflow_test.py
          bash source/tests/run-companion-contract.sh .wireless .tbt .pps
          bash source/tests/run-native-regressions.sh
          /usr/bin/python3 source/tools/rebuild-pinned-recipe.py source/mod/recipes/carplay-climate-m1.recipe out/native/carplay-climate-m1.recipe
          cp out/native/carplay-climate-m1.recipe source/mod/recipes/carplay-climate-m1.recipe
          sh "$SDK/bin/build-mod.sh" source/mod out/core out/work
          bash source/tests/run-regressions.sh
          sh source/mod/tools/video/fetch-libs.sh
          HMGAPI_MOD_CLASSES="$PWD/out/work/classes" HMGAPI_R8_CLASSPATH_ARGS="--classpath $SDK/lib/hmgapi-runtime.jar --classpath $SDK/lib/hmgapi-runtime-stubs.jar" sh source/mod/build.sh "$PWD/out/core"
          unzip -t out/core/hooks.jar
          cp -a source/mod out/staging/cpul
          rm -f out/staging/cpul/build.sh
          HMGAPI_MOD_BUILD="$PWD/out/core" sh "$SDK/bin/mkmodpkg.sh" out/staging/cpul "$KEY"
          # mkmodpkg packages recipes from the staging source, not the Java build.
          # Verify the signed ZIP contains exactly the freshly compiled payload.
          CPUL_ZIP="out/packages/carplay-ultra-lite-k5-$VERSION.zip"
          unzip -p "$CPUL_ZIP" recipes/carplay-climate-m1.recipe | cmp - out/native/carplay-climate-m1.recipe
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          {
            printf 'cpul=%s\n' "$GITHUB_SHA"
            for component in hmgapi comfort collector wireless pps tbt; do
              printf '%s=%s\n' "$component" "$(git -C ".$component" rev-parse HEAD)"
            done
            printf 'native_recipe_sha256=%s\n' "$(sha256sum out/native/carplay-climate-m1.recipe | cut -d ' ' -f 1)"
            printf 'author_uuid=%s\n' "$AUTHOR_UUID"
            clang --version
            ld.lld --version
          } > out/native/BUILD-PROVENANCE.txt
          cp -a .comfort/hmgapi-comfort out/staging/hmgapi-comfort
          python3 - <<'PY'
          import json
          p='out/staging/hmgapi-comfort/mod.json'
          d=json.load(open(p)); d['version']='1.1.8-cpul.rc.1'; open(p,'w').write(json.dumps(d,indent=2)+'\n')
          PY
          sh "$SDK/bin/build-mod.sh" out/staging/hmgapi-comfort out/hmgapi-comfort out/comfort-work
          # SDK install_mod uses basename of the built folder as the installed ID.
          test "$(basename "$PWD/out/hmgapi-comfort")" = hmgapi-comfort
          HMGAPI_MOD_BUILD="$PWD/out/hmgapi-comfort" sh out/staging/hmgapi-comfort/test.sh
          HMGAPI_MOD_BUILD="$PWD/out/hmgapi-comfort" sh "$SDK/bin/mkmodpkg.sh" out/staging/hmgapi-comfort "$KEY"
          cp -a source/check/mod out/staging/check
          javac --release 8 -cp "$AJ" -d out/check-classes source/mod/src/ioniq6/cpclimate/CarApi.java source/check/src/ioniq6/cpclimate/check/Main.java
          "$D8" --min-api 19 --lib "$AJ" --output out/check-dex $(find out/check-classes -name '*.class')
          (cd out/check-dex && zip -q "$OUT/staging/check/cp-climate-check.jar" classes.dex)
          sh "$SDK/bin/mkmodpkg.sh" out/staging/check "$KEY"
          cp -a .collector/HMG-IconDump out/staging/collector
          rm -rf out/staging/collector/src
          test "$(python3 -c 'import json; print(json.load(open(".collector/HMG-IconDump/mod.json"))["version"])')" = "1.0.0-rc.4"
          mkdir -p out/collector
          (cd .collector && HMGAPI_MOD_BUILD="$OUT/collector" sh HMG-IconDump/test.sh)
          cp out/collector/firmware-dump.jar out/staging/collector/
          sh "$SDK/bin/mkmodpkg.sh" out/staging/collector "$KEY"
          # Rebuild the modified provider's native library, never package the upstream prebuilt binary.
          W="$PWD/.wireless/wireless-carplay-aa"
          test "$(python3 -c 'import json; print(json.load(open(".wireless/wireless-carplay-aa/mod.json"))["version"])')" = "2.2.1-rc.7"
          mkdir -p out/wireless-tests
          javac --release 8 -d out/wireless-tests "$W/src/hmgapi/mods/wireless/api/CarPlayIdentification.java" "$W/src/hmgapi/mods/wireless/IdentityRegistry.java" "$W/src/hmgapi/mods/wireless/StartSessionCodec.java" "$W/native/identity/StartSessionCodecTest.java"
          java -cp out/wireless-tests hmgapi.mods.wireless.StartSessionCodecTest
          sh "$W/tools/cpturns/test.sh"
          sh "$W/tools/aa-text/test.sh"
          sh "$W/tools/reattach/test.sh"
          (cd .wireless && python3 .github/check-pin.py)
          python3 "$W/tests/session_journal_test.py"
          python3 "$W/tests/session_export_test.py"
          mkdir -p out/wcp-session-export
          javac --release 8 -d out/wcp-session-export "$W/src/hmgapi/mods/sessionexport/SessionExporter.java" "$W/tests/SessionExporterTest.java"
          java -cp out/wcp-session-export hmgapi.mods.sessionexport.SessionExporterTest
          # Mirror the remaining pinned WCP journal/identity host regressions.
          mkdir -p out/wcp-log-policy out/wcp-log-writer out/wcp-start-withdrawal out/wcp-resume-recovery
          javac --release 8 -d out/wcp-log-policy "$W/src/hmgapi/mods/wireless/dipo/SessionLogPolicy.java" "$W/src/hmgapi/mods/wireless/dipo/PreSessionEvents.java" "$W/tests/SessionLogPolicyTest.java"
          java -cp out/wcp-log-policy hmgapi.mods.wireless.dipo.SessionLogPolicyTest
          javac --release 8 -d out/wcp-log-writer "$W/src/hmgapi/mods/wireless/dipo/SessionLogWriter.java" "$W/src/hmgapi/mods/wireless/dipo/SessionLogPolicy.java" "$W/tests/SessionLogWriterTest.java"
          java -cp out/wcp-log-writer hmgapi.mods.wireless.dipo.SessionLogWriterTest
          javac --release 8 -d out/wcp-start-withdrawal "$W/src/hmgapi/mods/wireless/StartWithdrawal.java" "$W/tests/StartWithdrawalTest.java"
          java -cp out/wcp-start-withdrawal hmgapi.mods.wireless.StartWithdrawalTest
          javac --release 8 -d out/wcp-resume-recovery "$W/src/hmgapi/mods/wireless/ResumeRecovery.java" "$W/tests/ResumeRecoveryTest.java"
          java -cp out/wcp-resume-recovery hmgapi.mods.wireless.ResumeRecoveryTest
          # Mirror the final RC7 independent FileTransfer quarantine and native-boundary regressions.
          mkdir -p out/theme-archive
          javac --release 8 -d out/theme-archive "$W"/src/hmgapi/mods/wireless/ThemeArchiveCapture.java "$W"/tests/ThemeArchiveCaptureTest.java
          java -cp out/theme-archive hmgapi.mods.wireless.ThemeArchiveCaptureTest
          mkdir -p out/theme-session
          javac --release 8 -d out/theme-session "$W"/src/hmgapi/mods/wireless/ThemeArchiveCapture.java "$W"/src/hmgapi/mods/wireless/ThemeTransferSession.java "$W"/src/hmgapi/mods/wireless/ThemeQuarantineBudget.java "$W"/src/hmgapi/mods/wireless/ThemeOpack.java "$W"/tests/ThemeTransferSessionTest.java
          java -cp out/theme-session hmgapi.mods.wireless.ThemeTransferSessionTest
          mkdir -p out/theme-opack
          javac --release 8 -d out/theme-opack "$W"/src/hmgapi/mods/wireless/ThemeArchiveCapture.java "$W"/src/hmgapi/mods/wireless/ThemeTransferSession.java "$W"/src/hmgapi/mods/wireless/ThemeQuarantineBudget.java "$W"/src/hmgapi/mods/wireless/ThemeOpack.java "$W"/tests/ThemeOpackTest.java
          java -cp out/theme-opack hmgapi.mods.wireless.ThemeOpackTest
          python3 "$W"/tests/cpul_native_ownership.py
          mkdir -p out/theme-metadata
          javac --release 8 -d out/theme-metadata "$W"/src/hmgapi/mods/wireless/ThemeArchiveCapture.java "$W"/src/hmgapi/mods/wireless/ThemeTransferSession.java "$W"/src/hmgapi/mods/wireless/ThemeQuarantineBudget.java "$W"/src/hmgapi/mods/wireless/ThemeOpack.java "$W"/src/hmgapi/mods/wireless/ThemeCaptureMetadata.java "$W"/tests/ThemeTransferSessionTest.java "$W"/tests/ThemeCaptureMetadataTest.java
          java -cp out/theme-metadata hmgapi.mods.wireless.ThemeCaptureMetadataTest
          mkdir -p out/theme-pair
          javac --release 8 -d out/theme-pair "$W"/src/hmgapi/mods/wireless/ThemeArchiveCapture.java "$W"/src/hmgapi/mods/wireless/ThemeTransferSession.java "$W"/src/hmgapi/mods/wireless/ThemeQuarantineBudget.java "$W"/src/hmgapi/mods/wireless/ThemeOpack.java "$W"/src/hmgapi/mods/wireless/ThemeCaptureMetadata.java "$W"/src/hmgapi/mods/wireless/ThemeQuarantinePair.java "$W"/tests/ThemeTransferSessionTest.java "$W"/tests/ThemeCaptureMetadataTest.java "$W"/tests/ThemeQuarantinePairTest.java
          java -cp out/theme-pair hmgapi.mods.wireless.ThemeQuarantinePairTest
          mkdir -p out/theme-budget
          javac --release 8 -d out/theme-budget "$W"/src/hmgapi/mods/wireless/ThemeArchiveCapture.java "$W"/src/hmgapi/mods/wireless/ThemeTransferSession.java "$W"/src/hmgapi/mods/wireless/ThemeQuarantineBudget.java "$W"/src/hmgapi/mods/wireless/ThemeOpack.java "$W"/src/hmgapi/mods/wireless/ThemeCaptureMetadata.java "$W"/tests/ThemeTransferSessionTest.java "$W"/tests/ThemeCaptureMetadataTest.java "$W"/tests/ThemeQuarantineBudgetTest.java
          java -cp out/theme-budget hmgapi.mods.wireless.ThemeQuarantineBudgetTest
          sh "$SDK/bin/check-scripts.sh" "$W"
          sh "$W/native/identity/build.sh"
          cp -a "$W" out/staging/wireless-carplay-aa
          sh "$SDK/bin/build-mod.sh" out/staging/wireless-carplay-aa out/wireless-carplay-aa out/wireless-work
          HMGAPI_MOD_BUILD="$PWD/out/wireless-carplay-aa" sh "$SDK/bin/mkmodpkg.sh" out/staging/wireless-carplay-aa "$KEY"
          # Build PPS using its own regression tests and the same permanent key.
          (cd .pps && HMG_API="$PWD/../.hmgapi" ANDROID_JAR="$AJ" D8="$D8" HMGAPI_SDK="$SDK" HMGAPI_CP="$SDK/lib/hmgapi-engine.jar" PYTHON=/usr/bin/python3 SIGNING_KEY="$KEY" sh build.sh)
          PPS_VERSION=$(python3 -c 'import json; print(json.load(open(".pps/mod.json"))["version"])')
          test "$PPS_VERSION" = "1.0.0"
          cp ".pps/dist/phone-projection-scaling-$PPS_VERSION.zip" out/packages/
          # Standalone TBT owns navigation publishing when WCP TBT is disabled.
          # Build the pinned fork using its own policy regressions and our permanent author key.
          TBT_AJ="$ANDROID_HOME/platforms/android-19/android.jar"
          if [ ! -f "$TBT_AJ" ]; then
            SDKMANAGER=$(command -v sdkmanager || true)
            if [ -z "$SDKMANAGER" ]; then
              SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" "$ANDROID_HOME/tools" -type f -name sdkmanager 2>/dev/null | sort -V | tail -1 || true)
            fi
            test -n "$SDKMANAGER" && test -x "$SDKMANAGER"
            "$SDKMANAGER" --sdk_root="$ANDROID_HOME" "platforms;android-19"
          fi
          test -f "$TBT_AJ"
          (
            cd .tbt
            mkdir -p out/policy
            javac --release 8 -d out/policy src/CpSessionLifecycle.java src/CpSubscriptionRecovery.java tests/CpSessionLifecycleTest.java tests/CpSubscriptionRecoveryTest.java src/CpWazeRecovery.java tests/CpWazeRecoveryTest.java src/CpDistancePolicy.java tests/CpDistancePolicyTest.java src/ThirdPartyTrace.java tests/ThirdPartyTraceTest.java
            java -cp out/policy hmgapi.mods.projection.carplay.CpSessionLifecycleTest
            java -cp out/policy hmgapi.mods.projection.carplay.CpSubscriptionRecoveryTest
            java -cp out/policy hmgapi.mods.projection.carplay.CpWazeRecoveryTest
            java -cp out/policy hmgapi.mods.projection.carplay.CpDistancePolicyTest
            java -cp out/policy hmgapi.mods.projection.carplay.ThirdPartyTraceTest
            python3 tests/export_refresh_test.py
            python3 tests/api_result_export_test.py
            mkdir -p out/log-policy out/log-writer
            javac --release 8 -d out/log-policy src/SessionLogPolicy.java src/PreSessionEvents.java tests/SessionLogPolicyTest.java
            java -cp out/log-policy hmgapi.mods.projection.carplay.SessionLogPolicyTest
            javac --release 8 -d out/log-writer src/SessionLogWriter.java src/SessionLogPolicy.java tests/SessionLogWriterTest.java
            java -cp out/log-writer hmgapi.mods.projection.carplay.SessionLogWriterTest
            python3 tests/session_journal_test.py
            mkdir -p out/session-export
            javac --release 8 -d out/session-export src/SessionExporter.java tests/SessionExporterTest.java
            java -cp out/session-export hmgapi.mods.sessionexport.SessionExporterTest
            HMG_API="$OUT/../.hmgapi" ANDROID_JAR="$TBT_AJ" D8="$D8" SIGNING_KEY="$KEY" sh build.sh
          )
          TBT_VERSION=$(python3 -c 'import json; print(json.load(open(".tbt/mod.json"))["version"])')
          test "$TBT_VERSION" = "1.0.0-rc.4"
          cp ".tbt/dist/standalone-tbt-$TBT_VERSION.zip" out/packages/
          mkdir -p out/release
          for f in out/packages/*.zip; do
            tmp=$(mktemp -d)
            unzip -q "$f" -d "$tmp"
            java -cp "$SDK/lib/hmgapi-engine.jar" hmgapi.engine.Signing verify "$tmp" "$AUTHOR_UUID"
            rm -rf "$tmp"
            cp "$f" out/release/
          done
          test "$(find out/release -name '*.zip' | wc -l)" -eq 7
          cp "docs/rc${VERSION##*.}-testing.md" out/release/TESTING.md
          cp CHANGELOG.md out/release/CHANGELOG.md
          cp out/native/BUILD-PROVENANCE.txt out/release/BUILD-PROVENANCE.txt
          if [ "$VERSION" = "1.0.0-rc.11" ]; then cp docs/theme-pairing-validation.md out/release/theme-pairing-validation.md; fi
          printf '\n## Standalone TBT coexistence\nExplicitly disable WCP Integrated turn-by-turn, apply and restart before testing Standalone TBT. Keep Enable wireless CarPlay on; audio and Now Playing follow this master, and shared identity is independent. Remove the original Phone Projection TBT before installing the renamed fork. Never enable two navigation publishers.\n' >> out/release/TESTING.md
          (
            cd out/release
            sha256sum *.zip *.md BUILD-PROVENANCE.txt > SHA256SUMS.txt
            sha256sum --strict -c SHA256SUMS.txt
            bundle="CarPlay-Ultra-K5-$VERSION-bundle.zip"
            zip -q "$bundle" *.zip *.md BUILD-PROVENANCE.txt SHA256SUMS.txt
            unzip -t "$bundle"
            verify_dir=$(mktemp -d)
            unzip -q "$bundle" -d "$verify_dir"
            (cd "$verify_dir" && sha256sum --strict -c SHA256SUMS.txt)
            rm -rf "$verify_dir"
          )
      - uses: actions/upload-artifact@v4
        with:
          name: signed-packages
          path: out/release/
  publish:
    needs: package
    if: (github.event_name == 'workflow_dispatch' && inputs.publish == true) || (github.event_name == 'push' && github.ref == 'refs/heads/rc11-final' && github.event.head_commit.message == 'Release 1.0.0-rc.11')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: signed-packages
          path: release
      - name: Publish verified release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TARGET: ${{ github.sha }}
        run: |
          set -euo pipefail
          bundle=$(basename "$(find release -name 'CarPlay-Ultra-K5-*-bundle.zip' -print -quit)")
          VERSION=${bundle#CarPlay-Ultra-K5-}
          VERSION=${VERSION%-bundle.zip}
          gh release create "v$VERSION" release/*.zip release/SHA256SUMS.txt release/BUILD-PROVENANCE.txt release/*.md --prerelease --target "$TARGET" --title "CarPlay Ultra K5 $VERSION" --notes-file release/CHANGELOG.md
