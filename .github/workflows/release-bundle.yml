name: Signed release bundle
on:
  push:
    branches: [k5-compatibility]
permissions:
  contents: read
jobs:
  gate:
    if: startsWith(github.event.head_commit.message, 'Release ')
    runs-on: ubuntu-24.04
    outputs:
      release: ${{ steps.title.outputs.release }}
    steps:
      - id: title
        env:
          MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          title=$(printf '%s\n' "$MESSAGE" | head -n 1)
          if printf '%s\n' "$title" | grep -Eq '^Release [0-9]+\.[0-9]+\.[0-9]+-rc\.[0-9]+$'; then
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi
  package:
    needs: gate
    if: needs.gate.outputs.release == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: Open-HMG/HMG-API
          ref: a1830a83a8ad4bf3377be32e9064c5018947a2f6
          path: .hmgapi
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: Nyx-Asteria/hmgapi-comfort
          ref: 2724ac576da1f05991efdd34a8182fb7651c86bb
          path: .comfort
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: Nyx-Asteria/HMG-IconDump
          ref: 8a1dfaa12d133e9450f517c71a558420f46ad9c5
          path: .collector
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: Nyx-Asteria/hmgapi-wireless-cp-aa
          ref: 3790d63d9fd43bfe47e3b0d1ace65bdc3bcc1fa8
          path: .wireless
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: Nyx-Asteria/Phone-Projection-Scaling
          ref: 150962a2624f9b855ab6c41d3d5a631cdb7cbd30
          path: .pps
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: Nyx-Asteria/Standalone_TBT
          ref: d3602d5f1f470434f4b2eafb59acca3c6901085a
          path: .tbt
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Cache checksum-pinned video dependencies
        uses: actions/cache@v4
        with:
          path: |
            source/mod/tools/video/libs
            source/mod/tools/video/r8.jar
          key: cpul-video-${{ runner.os }}-${{ hashFiles('source/mod/tools/video/fetch-libs.sh') }}
      - name: SDK
        run: |
          sudo apt-get update -q
          sudo apt-get install -yq clang lld zip unzip mksh python3-pyelftools
          (cd .hmgapi && ./build.sh sdk)
          mkdir -p out/sdk
          unzip -q .hmgapi/out/dist/hmgapi-mod-sdk-*.zip -d out/sdk
      - name: Read release version
        run: |
          VERSION=$(python3 -c 'import json; print(json.load(open("source/mod/mod.json"))["version"])')
          echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+-rc\.[0-9]+$'
          test "$(git log -1 --format=%s)" = "Release $VERSION"
          test -f "docs/rc${VERSION##*.}-testing.md"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
      - name: Build and sign seven packages
        shell: bash
        env:
          MOD_KEY: ${{ secrets.MOD_KEY }}
          MOD_KEY_PUB: ${{ secrets.MOD_KEY_PUB }}
          AUTHOR_UUID: d515981b-afc8-8230-ae0f-62d32de366bc
        run: |
          set -euo pipefail
          export HMGAPI_SDK="$PWD/out/sdk"
          export OUT="$PWD/out"
          SDK="$HMGAPI_SDK"
          AJ=$(find "$ANDROID_HOME/platforms" -name android.jar | sort -V | tail -1)
          D8=$(find "$ANDROID_HOME/build-tools" -name d8 -type f | sort -V | tail -1)
          umask 077
          KEY="$RUNNER_TEMP/release-author.key"
          trap 'rm -f "$KEY" "$KEY.pub"' EXIT
          test -n "$MOD_KEY" && test -n "$MOD_KEY_PUB"
          printf '%s' "$MOD_KEY" | base64 -d > "$KEY"
          printf '%s' "$MOD_KEY_PUB" | base64 -d > "$KEY.pub"
          test "$(java -cp "$SDK/lib/hmgapi-engine.jar" hmgapi.engine.Signing uuid "$KEY.pub")" = "$AUTHOR_UUID"
          unset MOD_KEY MOD_KEY_PUB
          mkdir -p out/staging out/park-tests out/tests out/check-classes out/check-dex
          javac --release 8 -d out/park-tests source/mod/src/ioniq6/cpclimate/ParkedState.java source/tests/ParkedStateTest.java
          java -cp out/park-tests ioniq6.cpclimate.ParkedStateTest
          sh "$SDK/bin/build-mod.sh" source/mod out/core out/work
          CP="$PWD/out/work/classes:$AJ:$SDK/lib/hmgapi-runtime.jar:$SDK/lib/hmgapi-runtime-stubs.jar"
          javac --release 8 -cp "$CP" -d out/tests source/tests/ClimateMapTest.java
          java -cp "out/tests:$CP" ioniq6.cpclimate.ClimateMapTest
          javac --release 8 -cp "$CP" -d out/tests source/tests/VolumePanelPolicyTest.java
          java -cp "out/tests:$CP" ioniq6.cpclimate.VolumePanelPolicyTest
          python3 - <<'PY'
          import plistlib
          with open('out/python.bplist','wb') as f:
              plistlib.dump(dict(small=7,mid=300,wide=70000,huge=5000000000,neg=-2,s='Cluster_Display',u='Zürich ✓',t=True,f=False,d=bytes([1,2,3]),l=[1,'two'],n={'x':2},r=1.5,long='x'*40),f,fmt=plistlib.FMT_BINARY)
          PY
          javac --release 8 -cp "$CP" -d out/tests source/tests/UiSyncTest.java
          java -cp "out/tests:$CP" ioniq6.cpclimate.UiSyncTest out/tests out/python.bplist out/java.bplist
          sh source/mod/tools/video/fetch-libs.sh
          HMGAPI_MOD_CLASSES="$PWD/out/work/classes" HMGAPI_R8_CLASSPATH_ARGS="--classpath $SDK/lib/hmgapi-runtime.jar --classpath $SDK/lib/hmgapi-runtime-stubs.jar" sh source/mod/build.sh "$PWD/out/core"
          cp -a source/mod out/staging/cpul
          rm -f out/staging/cpul/build.sh
          HMGAPI_MOD_BUILD="$PWD/out/core" sh "$SDK/bin/mkmodpkg.sh" out/staging/cpul "$KEY"
          cp -a .comfort/hmgapi-comfort out/staging/hmgapi-comfort
          python3 - <<'PY'
          import json
          p='out/staging/hmgapi-comfort/mod.json'
          d=json.load(open(p)); d['version']='1.1.8-cpul.rc.1'; open(p,'w').write(json.dumps(d,indent=2)+'\n')
          PY
          sh "$SDK/bin/build-mod.sh" out/staging/hmgapi-comfort out/hmgapi-comfort out/comfort-work
          # SDK install_mod uses basename of the built folder as the installed ID.
          test "$(basename "$PWD/out/hmgapi-comfort")" = hmgapi-comfort
          HMGAPI_MOD_BUILD="$PWD/out/hmgapi-comfort" sh out/staging/hmgapi-comfort/test.sh
          HMGAPI_MOD_BUILD="$PWD/out/hmgapi-comfort" sh "$SDK/bin/mkmodpkg.sh" out/staging/hmgapi-comfort "$KEY"
          cp -a source/check/mod out/staging/check
          javac --release 8 -cp "$AJ" -d out/check-classes source/mod/src/ioniq6/cpclimate/CarApi.java source/check/src/ioniq6/cpclimate/check/Main.java
          "$D8" --min-api 19 --lib "$AJ" --output out/check-dex $(find out/check-classes -name '*.class')
          (cd out/check-dex && zip -q "$OUT/staging/check/cp-climate-check.jar" classes.dex)
          sh "$SDK/bin/mkmodpkg.sh" out/staging/check "$KEY"
          cp -a .collector/HMG-IconDump out/staging/collector
          rm -rf out/staging/collector/src
          mkdir -p out/collector
          (cd .collector && HMGAPI_MOD_BUILD="$OUT/collector" sh HMG-IconDump/test.sh)
          cp out/collector/firmware-dump.jar out/staging/collector/
          sh "$SDK/bin/mkmodpkg.sh" out/staging/collector "$KEY"
          # Rebuild the modified provider's native library, never package the upstream prebuilt binary.
          W="$PWD/.wireless/wireless-carplay-aa"
          test "$(python3 -c 'import json; print(json.load(open(".wireless/wireless-carplay-aa/mod.json"))["version"])')" = "2.2.1-rc.4"
          mkdir -p out/wireless-tests
          javac --release 8 -d out/wireless-tests "$W/src/hmgapi/mods/wireless/api/CarPlayIdentification.java" "$W/src/hmgapi/mods/wireless/IdentityRegistry.java" "$W/src/hmgapi/mods/wireless/StartSessionCodec.java" "$W/native/identity/StartSessionCodecTest.java"
          java -cp out/wireless-tests hmgapi.mods.wireless.StartSessionCodecTest
          sh "$W/tools/cpturns/test.sh"
          sh "$W/tools/aa-text/test.sh"
          sh "$W/native/identity/build.sh"
          cp -a "$W" out/staging/wireless-carplay-aa
          sh "$SDK/bin/build-mod.sh" out/staging/wireless-carplay-aa out/wireless-carplay-aa out/wireless-work
          HMGAPI_MOD_BUILD="$PWD/out/wireless-carplay-aa" sh "$SDK/bin/mkmodpkg.sh" out/staging/wireless-carplay-aa "$KEY"
          # Build PPS using its own regression tests and the same permanent key.
          (cd .pps && HMG_API="$PWD/../.hmgapi" ANDROID_JAR="$AJ" D8="$D8" HMGAPI_SDK="$SDK" HMGAPI_CP="$SDK/lib/hmgapi-engine.jar" PYTHON=/usr/bin/python3 SIGNING_KEY="$KEY" sh build.sh)
          PPS_VERSION=$(python3 -c 'import json; print(json.load(open(".pps/mod.json"))["version"])')
          test "$PPS_VERSION" = "1.0.0"
          cp ".pps/dist/phone-projection-scaling-$PPS_VERSION.zip" out/packages/
          # Standalone TBT owns navigation publishing when WCP TBT is disabled.
          # Build the pinned fork using its own policy regressions and our permanent author key.
          TBT_AJ="$ANDROID_HOME/platforms/android-19/android.jar"
          test -f "$TBT_AJ" || sdkmanager "platforms;android-19"
          (
            cd .tbt
            mkdir -p out/policy
            javac --release 8 -d out/policy src/CpSessionLifecycle.java src/CpSubscriptionRecovery.java tests/CpSessionLifecycleTest.java tests/CpSubscriptionRecoveryTest.java
            java -cp out/policy hmgapi.mods.projection.carplay.CpSessionLifecycleTest
            java -cp out/policy hmgapi.mods.projection.carplay.CpSubscriptionRecoveryTest
            python3 tests/export_refresh_test.py
            HMG_API="$OUT/../.hmgapi" ANDROID_JAR="$TBT_AJ" D8="$D8" SIGNING_KEY="$KEY" sh build.sh
          )
          TBT_VERSION=$(python3 -c 'import json; print(json.load(open(".tbt/mod.json"))["version"])')
          test "$TBT_VERSION" = "1.0.0-rc.1"
          cp ".tbt/dist/standalone-tbt-$TBT_VERSION.zip" out/packages/
          mkdir -p out/release
          for f in out/packages/*.zip; do
            tmp=$(mktemp -d)
            unzip -q "$f" -d "$tmp"
            java -cp "$SDK/lib/hmgapi-engine.jar" hmgapi.engine.Signing verify "$tmp" "$AUTHOR_UUID"
            rm -rf "$tmp"
            cp "$f" out/release/
          done
          test "$(find out/release -name '*.zip' | wc -l)" -eq 7
          cp "docs/rc${VERSION##*.}-testing.md" out/release/TESTING.md
          printf '\n## Standalone TBT coexistence\nDisable WCP Turn-by-turn on the cluster and HUD, apply and restart before testing Standalone TBT. Keep wireless bridge, audio, shared identity and phone Now Playing enabled. Remove the original Phone Projection TBT before installing the renamed fork. Never enable two navigation publishers.\n' >> out/release/TESTING.md
          (cd out/release && sha256sum *.zip > SHA256SUMS.txt && zip -q CarPlay-Ultra-Lite-K5-$VERSION-testing-bundle.zip *.zip TESTING.md SHA256SUMS.txt)
      - uses: actions/upload-artifact@v4
        with:
          name: signed-packages
          path: out/release/
  publish:
    needs: package
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: signed-packages
          path: release
      - name: Publish verified release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TARGET: ${{ github.sha }}
        run: |
          set -euo pipefail
          bundle=$(basename "$(find release -name 'CarPlay-Ultra-Lite-K5-*-testing-bundle.zip' -print -quit)")
          VERSION=${bundle#CarPlay-Ultra-Lite-K5-}
          VERSION=${VERSION%-testing-bundle.zip}
          gh release create "v$VERSION" release/*.zip release/SHA256SUMS.txt --latest --target "$TARGET" --title "CarPlay Ultra-Lite K5 $VERSION" --notes-file release/TESTING.md
