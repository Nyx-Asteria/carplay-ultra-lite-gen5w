name: Development regression
on:
  push:
    branches: [k5-compatibility, rc11]
    paths:
      - 'source/mod/src/**'
      - 'source/mod/recipes/**'
      - 'source/data/**'
      - 'source/tools/**'
      - 'source/check/**'
      - 'source/mod/tools/video/**'
      - 'source/mod/build.sh'
      - 'source/mod/settings.json'
      - 'source/mod/mod.json'
      - 'source/native/**'
      - 'source/tests/**'
      - '.github/workflows/release-bundle.yml'
      - '.github/workflows/development-regression.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-regression:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Native hook regression (host CFLite mock)
        run: bash source/tests/run-native-regressions.sh
      - name: Compile ARM payload and regenerate recipe
        run: |
          sudo apt-get update -q
          sudo apt-get install -yq clang lld python3-pyelftools
          /usr/bin/python3 source/tools/rebuild-pinned-recipe.py source/mod/recipes/carplay-climate-m1.recipe out/native/carplay-climate-m1.recipe
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          (
            cd out/native
            printf 'source_commit=%s\n' "$GITHUB_SHA" > BUILD-PROVENANCE.txt
            clang --version >> BUILD-PROVENANCE.txt
            ld.lld --version >> BUILD-PROVENANCE.txt
            sha256sum carplay-climate-m1.recipe > SHA256SUMS.txt
            sha256sum --strict -c SHA256SUMS.txt
          )
      - uses: actions/upload-artifact@v4
        with:
          name: native-recipe-${{ github.sha }}
          path: out/native/
          if-no-files-found: error
          retention-days: 14
  companion-contract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: Nyx-Asteria/hmgapi-wireless-cp-aa
          ref: 3b951c745ce78fde4ca6085b28d682c7d629bb98
          path: .wireless
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: Nyx-Asteria/Standalone_TBT
          ref: e8770256ff6679546c483af43aed3f7a6b19b998
          path: .tbt
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: Nyx-Asteria/Phone-Projection-Scaling
          ref: bd57be364d95d9542b5aaf81269fa2b8dc1d35e2
          path: .pps
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: bash source/tests/run-companion-contract.sh .wireless .tbt .pps
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: Open-HMG/HMG-API
          ref: daa083717f07565ba16dc8a4d26291b7d68d3bf4
          path: .hmgapi
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Cache checksum-pinned video dependencies
        uses: actions/cache@v4
        with:
          path: |
            source/mod/tools/video/libs
            source/mod/tools/video/r8.jar
          key: cpul-video-${{ runner.os }}-${{ hashFiles('source/mod/tools/video/fetch-libs.sh') }}
      - name: Compile and test without publishing
        run: |
          set -euo pipefail
          sudo apt-get update -q
          sudo apt-get install -yq clang lld zip unzip mksh
          (cd .hmgapi && ./build.sh sdk)
          mkdir -p out/sdk out/tests
          unzip -q .hmgapi/out/dist/hmgapi-mod-sdk-*.zip -d out/sdk
          export HMGAPI_SDK="$PWD/out/sdk"
          SDK="$HMGAPI_SDK"
          AJ=$(find "$ANDROID_HOME/platforms" -name android.jar | sort -V | tail -1)
          sh "$SDK/bin/build-mod.sh" source/mod out/core out/work
          bash source/tests/run-regressions.sh
      - name: Compile video engine without publishing
        run: |
          set -euo pipefail
          export HMGAPI_SDK="$PWD/out/sdk"
          SDK="$HMGAPI_SDK"
          sh source/mod/tools/video/fetch-libs.sh
          HMGAPI_MOD_CLASSES="$PWD/out/work/classes" HMGAPI_R8_CLASSPATH_ARGS="--classpath $SDK/lib/hmgapi-runtime.jar --classpath $SDK/lib/hmgapi-runtime-stubs.jar" sh source/mod/build.sh "$PWD/out/core"
          unzip -t out/core/hooks.jar
