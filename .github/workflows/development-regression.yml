name: Development regression
on:
  push:
    branches: [k5-compatibility, rc11]
    paths:
      - 'source/mod/src/**'
      - 'source/mod/recipes/**'
      - 'source/data/**'
      - 'source/tools/**'
      - 'source/check/**'
      - 'source/mod/tools/video/**'
      - 'source/mod/build.sh'
      - 'source/mod/settings.json'
      - 'source/mod/mod.json'
      - 'source/native/**'
      - 'source/tests/**'
      - '.github/workflows/release-bundle.yml'
      - '.github/workflows/development-regression.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: Open-HMG/HMG-API
          ref: daa083717f07565ba16dc8a4d26291b7d68d3bf4
          path: .hmgapi
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Cache checksum-pinned video dependencies
        uses: actions/cache@v4
        with:
          path: |
            source/mod/tools/video/libs
            source/mod/tools/video/r8.jar
          key: cpul-video-${{ runner.os }}-${{ hashFiles('source/mod/tools/video/fetch-libs.sh') }}
      - name: Compile and test without publishing
        run: |
          set -euo pipefail
          sudo apt-get update -q
          sudo apt-get install -yq clang lld zip unzip mksh
          (cd .hmgapi && ./build.sh sdk)
          mkdir -p out/sdk out/tests
          unzip -q .hmgapi/out/dist/hmgapi-mod-sdk-*.zip -d out/sdk
          export HMGAPI_SDK="$PWD/out/sdk"
          SDK="$HMGAPI_SDK"
          AJ=$(find "$ANDROID_HOME/platforms" -name android.jar | sort -V | tail -1)
          sh "$SDK/bin/build-mod.sh" source/mod out/core out/work
          bash source/tests/run-regressions.sh
      - name: Native hook regression (host CFLite mock)
        run: bash source/tests/run-native-regressions.sh
      - name: Compile video engine without publishing
        run: |
          set -euo pipefail
          export HMGAPI_SDK="$PWD/out/sdk"
          SDK="$HMGAPI_SDK"
          sh source/mod/tools/video/fetch-libs.sh
          HMGAPI_MOD_CLASSES="$PWD/out/work/classes" HMGAPI_R8_CLASSPATH_ARGS="--classpath $SDK/lib/hmgapi-runtime.jar --classpath $SDK/lib/hmgapi-runtime-stubs.jar" sh source/mod/build.sh "$PWD/out/core"
          unzip -t out/core/hooks.jar
