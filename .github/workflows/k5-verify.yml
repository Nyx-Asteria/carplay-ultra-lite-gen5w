name: K5 build verification
on:
  push:
    branches: [k5-compatibility]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Park predicate host tests
        run: |
          mkdir -p out/park-tests
          javac --release 8 -d out/park-tests source/mod/src/ioniq6/cpclimate/ParkedState.java source/tests/ParkedStateTest.java
          java -cp out/park-tests ioniq6.cpclimate.ParkedStateTest
      - uses: actions/checkout@v4
        with:
          repository: Open-HMG/HMG-API
          ref: 939484edfc7cbfe5d9f1f1bc3b321056dadb41a6
          path: .hmgapi
          persist-credentials: false
      - name: Build HMG-API SDK
        run: |
          sudo apt-get update -q
          sudo apt-get install -yq clang lld zip unzip mksh
          (cd .hmgapi && ./build.sh sdk)
          mkdir -p out/sdk
          unzip -q .hmgapi/out/dist/hmgapi-mod-sdk-*.zip -d out/sdk
      - name: Compile K5 hooks
        id: compile
        run: |
          sh out/sdk/bin/build-mod.sh source/mod out/core out/work
      - name: Climate regression tests
        run: |
          AJ=$(find "$ANDROID_HOME/platforms" -name android.jar | sort -V | tail -1)
          CP="$PWD/out/work/classes:$AJ:$PWD/out/sdk/lib/hmgapi-runtime.jar:$PWD/out/sdk/lib/hmgapi-runtime-stubs.jar"
          mkdir -p out/tests
          javac --release 8 -cp "$CP" -d out/tests source/tests/ClimateMapTest.java
          java -cp "out/tests:$CP" ioniq6.cpclimate.ClimateMapTest
      - name: Compile and merge video engine
        if: always() && steps.compile.outcome == 'success'
        run: |
          test -d out/work/classes
          sh source/mod/tools/video/fetch-libs.sh
          HMGAPI_MOD_CLASSES="$PWD/out/work/classes" HMGAPI_R8_CLASSPATH_ARGS="--classpath $PWD/out/sdk/lib/hmgapi-runtime.jar --classpath $PWD/out/sdk/lib/hmgapi-runtime-stubs.jar" sh source/mod/build.sh "$PWD/out/core"
          unzip -l out/core/hooks.jar
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: k5-compiled-hooks
          path: out/core/
          retention-days: 7
